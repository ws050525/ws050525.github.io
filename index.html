<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎂 生日快乐</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* ===== 重置 & 基础 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(145deg, #fde9f0 0%, #ffe6f0 40%, #fff9e6 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        /* ----- 顶部提示条 ----- */
        .top-notice-bar {
            background: rgba(255, 220, 240, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 2px solid #ffffff;
            padding: 12px 24px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 20px 40px;
            font-weight: 600;
            color: #a53860;
            box-shadow: 0 4px 20px #ffb8cf;
            z-index: 20;
            position: relative;
        }
        .notice-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.1rem;
            background: rgba(255,255,255,0.4);
            padding: 6px 18px;
            border-radius: 60px;
            backdrop-filter: blur(2px);
        }
        .notice-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #f76b9c;
            border-radius: 4px;
        }
        .notice-item label {
            cursor: pointer;
        }

        /* ----- 主容器----- */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px 50px;
            position: relative;
            z-index: 10;
        }

        /* 生日主卡片 */
        .birthday-card {
            max-width: 1200px;
            width: 100%;
            background: rgba(255, 255, 255, 0.58);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 48px;
            box-shadow: 
                0 30px 50px rgba(247, 120, 160, 0.2),
                0 0 0 2px rgba(255, 255, 255, 0.7) inset;
            padding: 44px 40px;
            border: 1px solid rgba(255, 220, 235, 0.6);
            margin-bottom: 40px;
        }

        /* 标题区 */
        .title-section {
            text-align: center;
            margin-bottom: 32px;
        }
        .birthday-emoji-big {
            font-size: 4.2rem;
            line-height: 1;
            filter: drop-shadow(0 8px 6px #ffb6c190);
            animation: wobble 2.8s infinite ease-in-out;
        }
        @keyframes wobble {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(6deg) scale(1.1); }
            50% { transform: rotate(-6deg) scale(1.08); }
            75% { transform: rotate(3deg) scale(1.02); }
        }
        h1 {
            font-size: 3.4rem;
            font-weight: 700;
            color: #b34b6b;
            letter-spacing: 2px;
            text-shadow: 0 4px 12px #ffb8d2, 2px 2px 0 #ffffff;
            margin: 8px 0 4px;
        }
        .sub-greeting {
            font-size: 1.4rem;
            font-weight: 600;
            color: #9e5d6f;
            background: rgba(255,255,240,0.5);
            display: inline-block;
            padding: 6px 28px;
            border-radius: 60px;
            backdrop-filter: blur(2px);
            margin-top: 4px;
        }

        /* 蛋糕展示区 */
        .cake-area {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 30px;
            margin: 40px 0 20px;
        }
        .cake-illustration {
            background: #fff2f5e0;
            border-radius: 140px 140px 48px 48px;
            padding: 22px 22px 16px 22px;
            box-shadow: 0 16px 30px #fcaac0;
            transform: rotate(-1deg);
            border: 4px solid white;
        }
        .cake-emoji-big {
            font-size: 8rem;
            line-height: 1;
            display: block;
            filter: drop-shadow(2px 10px 8px #d97093);
        }
        .candle-flame {
            font-size: 2.8rem;
            margin-top: -30px;
            margin-bottom: 8px;
            animation: flicker 0.5s infinite alternate;
        }
        @keyframes flicker {
            0% { 
                text-shadow: 0 0 2px gold, 0 0 8px orange; 
                opacity: 1; 
                transform: scale(1); 
            }
            100% { 
                text-shadow: 0 0 8px yellow, 0 0 16px #ff9f00; 
                opacity: 0.95; 
                transform: scale(1.1); 
            }
        }

        /* ===== 祝福气球专用容器 ===== */
        .balloon-container {
            background: rgba(255, 245, 250, 0.7);
            border-radius: 30px;
            padding: 30px;
            margin: 30px 0;
            box-shadow: 0 10px 25px rgba(247, 120, 160, 0.2);
            border: 2px dashed #f76b9c;
            position: relative;
            overflow: hidden;
        }
        .balloon-header {
            text-align: center;
            margin-bottom: 25px;
            font-size: 1.8rem;
            color: #b34b6b;
            font-weight: 700;
        }
        .blessing-balloons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
            position: relative;
            z-index: 1;
            min-height: 120px;
        }
        .balloon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            position: relative;
            cursor: pointer;
            animation: float 4s infinite ease-in-out;
            z-index: 1;
        }
        .balloon::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff9eb5, #ffb6c1);
            opacity: 0.8;
            z-index: -1;
        }
        .balloon::after {
            content: "";
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 15px;
            height: 30px;
            background: #ff9eb5;
            border-radius: 50%;
            z-index: -1;
        }
        .balloon:hover {
            transform: scale(1.1);
        }
        .balloon.pop {
            animation: pop 0.5s ease-out forwards;
        }
        @keyframes pop {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        /* ===== 祝福弹窗样式 ===== */
        .blessing-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 30px 40px;
            text-align: center;
            max-width: 80%;
            z-index: 1000;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            border: 2px solid #f76b9c;
            display: none;
        }
        .blessing-message h2 {
            font-size: 2.2rem;
            color: #b34b6b;
            margin-bottom: 15px;
        }
        .blessing-message p {
            font-size: 1.6rem;
            color: #9e5d6f;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .close-message {
            background: #f76b9c;
            color: white;
            border: none;
            padding: 10px 30px;
            border-radius: 30px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .close-message:hover {
            background: #e55a8a;
            transform: scale(1.05);
        }

        /* ===== 爱心弹窗样式 ===== */
        .love-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: linear-gradient(145deg, #ff9eb5, #ffb6c1);
            border-radius: 30px;
            padding: 30px;
            text-align: center;
            z-index: 1000;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
            display: none;
            animation: popup 0.5s forwards;
        }
        @keyframes popup {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        .love-popup h2 {
            font-size: 2.2rem;
            color: white;
            margin-bottom: 15px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        .love-popup p {
            font-size: 1.6rem;
            color: white;
            line-height: 1.6;
            margin-bottom: 20px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }
        .close-love {
            background: white;
            color: #b34b6b;
            border: none;
            padding: 10px 30px;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        .close-love:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

       /* 时间轴容器样式 */
        .timeline-container {
            background: rgba(255, 245, 250, 0.7);
            border-radius: 30px;
            padding: 20px;
            margin: 30px 0;
            box-shadow: 0 10px 25px rgba(247, 120, 160, 0.2);
            border: 2px dashed #f76b9c;
            position: relative;
            overflow: hidden;
        }

        .timeline-header {
            text-align: center;
            margin-bottom: 25px;
            font-size: 1.8rem;
            color: #b34b6b;
            font-weight: 700;
        }

        .timeline {
            position: relative;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px 0;
        }

        .timeline::before {
            content: '';
            position: absolute;
            top: 1; bottom: 0;
            width: 4px;
            background: #f76b9c;
            left: 50%;
            margin-left: -2px;
            z-index: 1;
        }

        .timeline-item {
            position: relative;
            width: calc(50% - 40px);
            padding: 20px;
            margin-bottom: 50px;
            margin-left: -45px;
            margin-right: 10px;
        }

        .timeline-item:nth-child(odd) {
            float: left;
            clear: both;
            text-align: left;
        }

        .timeline-item:nth-child(even) {
            float: right;
            clear: both;
            text-align: left; 
        }

        .timeline-content {
            background: rgba(255, 255, 255, 0.7);
            border-radius: 20px;
            padding: 5px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.5);
            position: relative;
        }

        .timeline-content h3 {
            font-size: 1.8rem;
            color: #b34b6b;
            margin-bottom: 15px;
        }

        .timeline-content p {
            font-size: 1.2rem;
            color: #666;
            line-height: 1.6;
        }

        .timeline-date {
            position: absolute;
            top: -30px;
            width: 100px;
            text-align: center;
            font-weight: 700;
            color: #f76b9c;
            font-size: 1.3rem;
            background: white;
            border-radius: 50%;
            height: 60px;
            line-height: 60px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            z-index: 2;
        }

        .timeline-item:nth-child(odd) .timeline-date {
            right: -50px;
        }

        .timeline-item:nth-child(even) .timeline-date {
            left: -50px;
        }

        .timeline-image {
            width: 115%;
            height: 500px;
            background-size: cover;
            background-position: center;
            border-radius: 15px;
            margin-top: 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }

       /* ===== 轮播照片容器整体样式 ===== */
        .photo-carousel-container {
            /* 淡粉色半透明背景 */
            background: rgba(255, 245, 250, 0.7);
            /* 圆角边框 */
            border-radius: 30px;
            /* 内边距 */
            padding: 30px;
            /* 上下外边距 */
            margin: 30px 0;
            /* 阴影效果 */
            box-shadow: 0 10px 25px rgba(247, 120, 160, 0.2);
            /* 粉色虚线边框 */
            border: 2px dashed #f76b9c;
            /* 相对定位 */
            position: relative;
            /* 隐藏溢出内容 */
            overflow: hidden;
            /* 文字居中对齐 */
            text-align: center;
        }

        /* 轮播头部标题样式 */
        .carousel-header {
            /* 字体大小 */
            font-size: 1.8rem;
            /* 深粉色文字颜色 */
            color: #b34b6b;
            /* 粗体 */
            font-weight: 700;
            /* 下外边距 */
            margin-bottom: 20px;
        }

        /* 轮播主容器 - 修复 */
        .photo-carousel {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 500px;
            margin: 0 auto;
            overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        /* 照片项 */
        .photo-item {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            pointer-events: none;
        }

        .photo-item.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* 照片样式 */
        .photo-carousel img {
            width: 100%;
            height: calc(100% - 30px);
            object-fit: cover;
            display: block;
        }

        /* 照片标题样式 */
        .photo-title {
        position: absolute;
        bottom: 20px;  /* 从10px增加到20px，稍微抬高一点 */
        left: 50%;  /* 改为50%实现水平居中 */
        transform: translateX(-50%);  /* 水平居中偏移 */
        background: linear-gradient(135deg, #ff9eb5, #ff6b9d); /* 渐变背景 */
        color: white;  /* 文字颜色改为白色 */
        font-size: 24px;  /* 从18px增大到24px */
        font-weight: 700;  /* 加粗 */
        font-family: 'Quicksand', '微软雅黑', sans-serif;
        padding: 12px 30px;  /* 增大内边距 */
        border-radius: 50px;  /* 更圆的角 */
        letter-spacing: 1px;  /* 增加字间距 */
        text-shadow: 2px 2px 4px rgba(0,0,0,0.3);  /* 文字阴影 */
        box-shadow: 0 4px 15px rgba(247, 120, 160, 0.4);  /* 添加阴影 */
        border: 2px solid white;  /* 白色边框 */
        z-index: 10;
        white-space: nowrap;  /* 防止文字换行 */
        }

        /* 控制按钮样式 */
        .carousel-controls {
            text-align: center;
            margin-top: 20px;
        }

        .prev-btn, .next-btn {
            background: rgba(255, 245, 250, 0.7);
            color: #b34b6b;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
            margin: 0 10px;
        }

        .prev-btn:hover, .next-btn:hover {
            background: #f76b9c;
            color: white;
        }

        /* ===== 祝福心形弹窗容器 ===== */
        .heart-popup-container {
            background: rgba(255, 245, 250, 0.7);
            border-radius: 30px;
            padding: 30px;
            margin: 30px 0;
            box-shadow: 0 10px 25px rgba(247, 120, 160, 0.2);
            border: 2px dashed #f76b9c;
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .heart-popup-header {
            font-size: 1.8rem;
            color: #b34b6b;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .cake-trigger-btn {
            background: transparent;
            border: none;
            font-size: 4rem;
            cursor: pointer;
            transition: transform 0.3s;
            animation: pulse 2s infinite;
        }

        .cake-trigger-btn:hover {
            transform: scale(1.1);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* 底部操作区 */
        .action-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-top: 30px;
        }
        .btn-birthday-link {
            display: inline-flex;
            align-items: center;
            gap: 18px;
            background: #f382a6;
            border: none;
            color: white;
            font-size: 1.7rem;
            font-weight: 700;
            padding: 18px 32px;
            border-radius: 48px;
            box-shadow: 0 10px 0 #b13e64, 0 12px 28px #d95f89;
            cursor: pointer;
            transition: all 0.1s cubic-bezier(0.2, 1.2, 0.8, 1);
            border: 3px solid #ffeef4;
            letter-spacing: 2px;
            text-decoration: none;
        }
        .btn-birthday-link:active {
            transform: translateY(8px);
            box-shadow: 0 4px 0 #b13e64, 0 12px 24px #d95f89;
        }
        .balloon-mini-group {
            font-size: 2.6rem;
            filter: drop-shadow(2px 10px 6px #e0779b);
            animation: drift 4s infinite alternate ease-in-out;
        }
        @keyframes drift {
            0% { transform: translateX(0) rotate(-2deg); }
            100% { transform: translateX(12px) rotate(3deg); }
        }

        /* ----- 底部忠告栏 ----- */
        .bottom-advice-bar {
            background: rgba(255, 220, 235, 0.8);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-top: 3px solid white;
            padding: 24px 20px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 30px 50px;
            font-weight: 600;
            color: #972b52;
            box-shadow: 0 -6px 20px #ffb0c8;
            z-index: 20;
            position: relative;
            margin-top: auto;
        }
        .advice-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            background: rgba(255,255,255,0.5);
            padding: 12px 24px;
            border-radius: 48px;
            border: 2px solid white;
            min-width: 160px;
        }
        .advice-title {
            font-size: 1rem;
            opacity: 0.9;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }
        .advice-content {
            font-size: 1.2rem;
            font-weight: 700;
            color: #b33b66;
            line-height: 1.4;
        }
        .advice-small {
            font-size: 0.9rem;
            font-weight: 500;
            margin-top: 6px;
            opacity: 0.9;
        }

        /* 飘浮装饰 */
        .floating-confetti {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }
        .confetti-piece {
            position: absolute;
            width: 24px;
            height: 24px;
            background-color: #ffb3c6;
            opacity: 0.7;
            border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
            animation: fallDown 8s infinite linear; /* 改为fallDown动画，时间缩短 */
            box-shadow: 0 0 10px rgba(255, 180, 200, 0.5);
        }

        /* 从上至下的动画 */
        @keyframes fallDown {
            0% { 
                transform: translateY(-20vh) rotate(0deg); /* 从上方开始 */
                opacity: 0.8; 
            }
            100% { 
                transform: translateY(120vh) rotate(720deg); /* 落到下方，旋转更多圈 */
                opacity: 0; 
            }
        }
        /* 音乐控制按钮 */
        .music-control {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 999;
            background: rgba(255, 240, 245, 0.8);
            backdrop-filter: blur(8px);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            box-shadow: 0 8px 20px #f598b4, 0 0 0 3px white;
            cursor: pointer;
            transition: 0.2s;
            border: none;
            color: #ad4c6e;
        }
        .music-control:hover {
            transform: scale(1.1) rotate(5deg);
            background: #ffe1ec;
        }
        .music-control.playing {
            background: #fec9de;
            box-shadow: 0 0 18px #ff88b0;
        }
        .music-tooltip {
            position: fixed;
            bottom: 90px;
            right: 30px;
            background: #ffffffdd;
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 600;
            color: #ab496b;
            font-size: 0.9rem;
            backdrop-filter: blur(2px);
            box-shadow: 0 4px 10px #fca3bf;
            border: 2px solid white;
            z-index: 998;
            pointer-events: none;
        }

        /* 响应式 */
        @media (max-width: 700px) {
            .birthday-card {
                padding: 30px 20px;
            }
            h1 {
                font-size: 2.5rem;
            }
            .action-buttons {
                flex-direction: column;
                width: 100%;
            }
            .timeline::before {
                left: 30px;
            }
            .timeline-item {
                width: calc(100% - 60px);
                padding: 20px 20px;
                margin-left: 60px;
                margin-right: 0;
            }
            .timeline-item:nth-child(odd),
            .timeline-item:nth-child(even) {
                float: none;
                clear: both;
                text-align: center;
            }
            .timeline-item:nth-child(odd) .timeline-date,
            .timeline-item:nth-child(even) .timeline-date {
                position: absolute;
                left: -30px;
                top: -30px;
                width: 60px;
                height: 60px;
                line-height: 60px;
            }
            
            .photo-carousel {
                height: 300px;
            }
        }

        /* ===== 新增：心形祝福框样式 ===== */
        .heart-blessing-box {
            position: absolute;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-family: 'Quicksand', '微软雅黑', sans-serif;
            font-size: 18px;
            font-weight: 600;
            color: #333;
            padding: 10px;
            box-sizing: border-box;
            opacity: 0;
            transform: scale(0.8);
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
            z-index: 10000;
            border: 2px solid rgba(255,255,255,0.8);
            backdrop-filter: blur(2px);
        }
    </style>
</head>
<body>
    <!-- 飘落彩纸屑背景 -->
    <div class="floating-confetti" id="confettiContainer"></div>

    <!-- 主内容区 -->
    <div class="main-container">
        <!-- 生日卡片 -->
        <div class="birthday-card">
            <div class="title-section">
                <div class="birthday-emoji-big">🥳🎈🎂</div>
                <h1>HAPPY BIRTHDAY</h1>
                <div class="sub-greeting">致 我亲爱的老Baby</div>
            </div>

            <!-- 蛋糕与祝福语区域 -->
            <div class="cake-area">
                <div class="cake-illustration">
                    <span class="cake-emoji-big">🍰🧁🎂</span>
                    <div class="candle-flame">✨🕯️✨</div>
                </div>
            </div>

            <!-- ===== 祝福气球专用容器 ===== -->
            <div class="balloon-container">
                <div class="balloon-header">🎈 点击气球 · 收集祝福 🎈</div>
                <div class="blessing-balloons" id="blessingBalloons">
                    <!-- 气球将通过JS生成 -->
                </div>
                <div class="action-row">
                    <button class="btn-birthday-link" id="startBalloonsBtn">
                        <span>❤️</span> 点燃气球 · 收集祝福 <span>❤️</span>
                    </button>
                    <div class="balloon-mini-group">🎈🎈🎈🎈🎈</div>
                </div>
            </div>

            <!-- ===== 忆往昔 - 时间轴 ===== -->
            <div class="timeline-container">
                <div class="timeline-header">📸 忆往昔 · 时光长廊 🎞️</div>
                <div class="timeline" id="timeline">
                    <!-- 时间轴项将通过JS生成 -->
                </div>
            </div>

            <!-- ===== 轮播照片展示区 ===== -->
            <div class="photo-carousel-container">
                <div class="carousel-header">📸 幸福瞬间 · 轮播相册 📸</div>
                <div class="photo-carousel" id="photoCarousel">
                    <!-- 照片将通过JS动态插入 -->
                </div>
                <div class="carousel-controls">
                    <button class="prev-btn" id="prevPhotoBtn">❮ 上一张</button>
                    <button class="next-btn" id="nextPhotoBtn">下一张 ❯</button>
                </div>
            </div>

            <!-- ===== 祝福心形弹窗容器 ===== -->
            <div class="heart-popup-container">
                <div class="heart-popup-header">🎂 点击蛋糕 · 心形祝福 🎂</div>
                <button class="cake-trigger-btn" id="cakeTriggerBtn">🎂</button>
            </div>
        </div>
    </div>

    <!-- 底部忠告栏 -->
    <div class="bottom-advice-bar">
        <div class="advice-block">
            <div class="advice-title">🎂 生日祈愿</div>
            <div class="advice-content">拒绝烦恼，保持开心</div>
        </div>
        <div class="advice-block">
            <div class="advice-title">✨ 特别提醒</div>
            <div class="advice-content">记得吃蛋糕，许心愿</div>
        </div>
        <div class="advice-block">
            <div class="advice-title">💝 祝福</div>
            <div class="advice-content">被爱包围，闪闪发光</div>
        </div>
    </div>

    <!-- 本地BGM部分 -->
    <audio id="bgmAudio" loop preload="auto">
        <source src="birthday.mp3" type="audio/mpeg">
        您的浏览器不支持 audio 元素。
    </audio>
    <div class="music-tooltip" id="musicTooltip">🎵 点击播放BGM</div>
    <button class="music-control" id="musicToggleBtn">🔇</button>

    <!-- ===== 祝福弹窗（固定结构） ===== -->
    <div class="blessing-message" id="blessingMessage">
        <h2>生日祝福</h2>
        <p id="blessingText">祝你生日快乐，幸福美满！</p>
        <button class="close-message" id="closeMessage">关闭</button>
    </div>

    <!-- ===== 爱心弹窗 ===== -->
    <div class="love-popup" id="lovePopup">
        <h2>🎂 生日祝福 🎂</h2>
        <p id="loveMessage">今天是您的生辰之际，盼往后岁月，喜乐安宁，福寿绵长，万事如意。</p>
        <button class="close-love" id="closeLove">收到啦！</button>
    </div>

    <!-- ===== 新增：心形祝福容器（所有div弹窗都在这里） ===== -->
    <div id="heartContainer" style="position: fixed; top:0; left:0; width:100%; height:100%; pointer-events: none; z-index: 9999;"></div>

    <script>
        // === 工具函数 ===
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // === 数据 ===
        const BLESSINGS = [
            "祝我们家这匹精神老马喜享遐龄，福寿双全！祝六旬小寿星岁岁长欢愉，年年皆胜意！——乐乐姐",
            "六十岁是人生的新起点，愿您以更加从容的姿态，享受生活的美好，福寿双全，喜乐绵长。——大爷",
            "爸，六十寿辰快乐！愿您身体硬朗，吃好睡好，年年长健，事事如心，岁岁安康，喜乐常伴。——二宝哥",
            "耘夫，今天是你六十岁生日，俗话说“花甲之年，健康是福”。愿你从此跨过沟沟坎坎，身体硬硬朗朗、快乐幸福日日满满。在这幸福的日子里，家人为你祈福，愿永远拥有幸福平安健康！老公，生日快乐！——大姐",
            "六十载春秋轮回，人生又迈入新篇章，逢老叔甲子大寿之际，侄儿周帅祝老叔心态永十八，马年马上发，烦恼不沾身，快乐常相伴，吃嘛嘛香，身体倍儿棒！——大帅哥",
            "二哥、二嫂祝周耘夫生日快乐！身体健康！马年行大运！——二大爷、二大娘",
            "祝我儿子生日快乐！——姥姥",
            "周家今天的幸福，离不开你的付出、奉献、担当，祝我的好弟弟今后人生幸福安康！——姑姑"
        ];
        const TIME_LINE_ITEMS = [
            {
                title: "出生",
                description: "1966年1月29日，你来到了这个世界。家人满心欢喜，迎接这个小生命的到来。",
                image: "Baby1.jpg"
            },
            {
                title: "少年时代",
                description: "你在父母的陪伴下，快乐成长。",
                image: "Baby2.jpg"
            },
            {
                title: "青年时代",
                description: "你与哥哥姐姐们，共享幸福时光，留下了许多珍贵的回忆。",
                image: "Baby3.jpg"
            },
            {
                title: "军旅时代",
                description: "1982年11月，你参军入伍，步入了军旅时代，锻炼了坚强的意志和不屈的精神。",
                image: "Baby4.jpg"
            },
            {
                title: "事业起点",
                description: "90年代初，你扛起摄像机，敲响人生的幸福之门。",
                image: "Baby5.jpg"
            },
            {
                title: "疫情岁月",
                description: "疫情期间，你发挥党员先锋模范作用，坚守在疫情防护第一线。",
                image: "Baby6.jpg"
            },
            {
                title: "工作光影",
                description: "工作中，你身为领导，深入基层，服务于退役老兵。",
                image: "Baby7.jpg"
            },
            {
                title: "退休生活",
                description: "2025年2月，你正式退休。在孩儿们的陪伴下，享受着属于自己的幸福。",
                image: "Baby8.jpg"
            }
        ];

        // === 轮播照片数据 ===
        const PHOTO_IMAGES = [
            { src: "NewBaby1.jpg", title: "幸福时刻 1" },
            { src: "NewBaby2.jpg", title: "幸福时刻 2" },
            { src: "NewBaby3.jpg", title: "幸福时刻 3" },
            { src: "NewBaby4.jpg", title: "幸福时刻 4" },
            { src: "NewBaby5.jpg", title: "幸福时刻 5" }
        ];

        // === 祝福心形弹窗配置 ===
        const HEART_TIPS = [
            "生日快乐",
            "幸福安康",
            "保持好心情",
            "好好爱自己",
            "福如东海",
            "寿比南山",
            "美意延年",
            "福寿绵绵",
            "顺顺利利",
            "早点休息",
            "愿所有烦恼都消失",
            "别熬夜",
            "今天过得开心嘛",
            "人寿年丰"
        ];

        const HEART_BG_COLORS = [
            "lightpink", "skyblue", "lightgreen", "lavender", "lightyellow",
            "plum", "coral", "bisque", "aquamarine", "mistyrose",
            "honeydew", "lavenderblush", "oldlace"
        ];

        // === 全局状态 ===
        let shuffledBlessings = BLESSINGS.length > 0 ? shuffleArray(BLESSINGS) : [];
        let currentIndex = 0;
        let currentPhotoIndex = 0;
        let isHeartAnimationRunning = false;
        let autoPlayInterval = null;

        // === 轮播照片功能 - 修复版 ===
        function createPhotoCarousel() {
            const container = document.getElementById('photoCarousel');
            if (!container) return;

            // 清空容器
            container.innerHTML = '';

            // 创建所有图片元素和标题
            PHOTO_IMAGES.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'photo-item';
                if (index === 0) div.classList.add('active'); // 第一张激活

                const img = document.createElement('img');
                img.src = item.src;
                img.alt = item.title;
                div.appendChild(img);

                const titleDiv = document.createElement('div');
                titleDiv.className = 'photo-title';
                titleDiv.innerText = item.title;
                div.appendChild(titleDiv);

                container.appendChild(div);
            });

            // 清除之前的定时器
            if (autoPlayInterval) {
                clearInterval(autoPlayInterval);
            }
        }

        function changePhoto(index) {
            const items = document.querySelectorAll('.photo-item');
            if (items.length === 0) return;

            // 计算新索引（循环）
            index = (index + items.length) % items.length;
            
            // 移除当前激活项的active类
            items[currentPhotoIndex].classList.remove('active');
            
            // 更新索引
            currentPhotoIndex = index;
            
            // 添加新激活项的active类
            items[currentPhotoIndex].classList.add('active');
        }

        // === 气球功能 ===
        function createBalloons() {
            const container = document.getElementById('blessingBalloons');
            if (!container) return;
            container.innerHTML = '';
            
            for (let i = 0; i < 8; i++) {
                const balloon = document.createElement('div');
                balloon.className = 'balloon';
                balloon.addEventListener('click', function() {
                    showNextBlessing();
                    this.classList.add('pop');
                    setTimeout(() => {
                        this.remove();
                    }, 500);
                });
                container.appendChild(balloon);
            }
        }

        function showNextBlessing() {
            if (BLESSINGS.length === 0) {
                console.warn('祝福语列表为空');
                return;
            }

            if (shuffledBlessings.length === 0 || currentIndex >= shuffledBlessings.length) {
                shuffledBlessings = shuffleArray(BLESSINGS);
                currentIndex = 0;
            }

            document.getElementById('blessingText').textContent = shuffledBlessings[currentIndex];
            const popup = document.getElementById('blessingMessage');
            if (popup) {
                popup.style.display = 'block';
            }

            currentIndex++;
        }

        function showLovePopup() {
            const randomMessage = "今天是您的生辰之际，盼往后岁月，喜乐安宁，福寿绵长，万事如意。——三宝";
            document.getElementById('loveMessage').textContent = randomMessage;
            const popup = document.getElementById('lovePopup');
            popup.style.display = 'block';
            // 重置动画
            popup.style.animation = 'none';
            setTimeout(() => {
                popup.style.animation = 'popup 0.5s forwards';
            }, 10);
        }

        function createTimeline() {
            const container = document.getElementById('timeline');
            if (!container) return;
            container.innerHTML = '';
            
            TIME_LINE_ITEMS.forEach((item) => {
                const timelineItem = document.createElement('div');
                timelineItem.className = 'timeline-item';
                timelineItem.innerHTML = `
                    <div class="timeline-content">
                        <h3>${item.title}</h3>
                        <p>${item.description}</p>
                        <div class="timeline-image" style="background-image: url('${item.image}');"></div>
                    </div>
                `;
                container.appendChild(timelineItem);
            });
        }

        // === 新增：心形div弹窗功能 - 一个一个弹出 ===
        function createHeartDivs(count) {
            const heartContainer = document.getElementById('heartContainer');
            if (!heartContainer) {
                console.error('未找到 heartContainer');
                return;
            }

            // 防止重复触发
            if (isHeartAnimationRunning) return;
            isHeartAnimationRunning = true;

            // 先清除之前残留的祝福框
            heartContainer.innerHTML = '';

            const screenWidth = window.innerWidth;
            const screenHeight = window.innerHeight;
            const boxWidth = 180;   // 每个祝福框宽度
            const boxHeight = 80;    // 高度
            const heartScale = 0.35; // 心形缩放系数

            // 预计算所有框的位置和祝福语
            const boxes = [];
            for (let i = 0; i < count; i++) {
                // 计算心形坐标
                const t = 2 * Math.PI * i / count;
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);

                const scaleFactor = Math.min(screenWidth, screenHeight) * heartScale / 16;
                const centerX = screenWidth / 2 - boxWidth / 2;
                const centerY = screenHeight / 2 - boxHeight / 2;

                let left = centerX + x * scaleFactor;
                let top = centerY - y * scaleFactor;

                // 增加轻微随机偏移，让心形更自然
                left += (Math.random() - 0.5) * 15;
                top += (Math.random() - 0.5) * 15;

                // 边界限制
                left = Math.max(0, Math.min(left, screenWidth - boxWidth));
                top = Math.max(0, Math.min(top, screenHeight - boxHeight));

                // 选择祝福语（最后一个固定）
                let tip;
                if (i === count - 1) {
                    tip = "老爸，生日快乐";
                } else {
                    tip = HEART_TIPS[Math.floor(Math.random() * HEART_TIPS.length)];
                }

                // 随机背景色
                const bgColor = HEART_BG_COLORS[Math.floor(Math.random() * HEART_BG_COLORS.length)];

                boxes.push({
                    left,
                    top,
                    tip,
                    bgColor
                });
            }

            // 逐个弹出（每200毫秒弹出一个）
            let currentBoxIndex = 0;
            
            function showNextBox() {
                if (currentBoxIndex >= boxes.length) {
                    // 所有框都显示完了，重置标志
                    setTimeout(() => {
                        isHeartAnimationRunning = false;
                    }, 1000);
                    return;
                }

                const box = boxes[currentBoxIndex];
                
                // 创建 div
                const div = document.createElement('div');
                div.className = 'heart-blessing-box';
                div.textContent = box.tip;
                div.style.left = box.left + 'px';
                div.style.top = box.top + 'px';
                div.style.width = boxWidth + 'px';
                div.style.height = boxHeight + 'px';
                div.style.backgroundColor = box.bgColor;
                
                // 初始状态：透明且缩小
                div.style.opacity = '0';
                div.style.transform = 'scale(0.5)';
                
                heartContainer.appendChild(div);

                // 触发渐现动画
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        div.style.opacity = '1';
                        div.style.transform = 'scale(1)';
                    });
                });

                // 定时移除（20秒后）
                setTimeout(() => {
                    if (div.parentNode) {
                        div.style.opacity = '0';
                        div.style.transform = 'scale(0.5)';
                        setTimeout(() => div.remove(), 300);
                    }
                }, 25000);

                // 准备下一个
                currentBoxIndex++;
                setTimeout(showNextBox, 200); // 200毫秒弹出一个
            }

            // 开始逐个弹出
            showNextBox();
        }

        // === 初始化 ===
        document.addEventListener('DOMContentLoaded', function() {
            // 生成初始气球
            createBalloons();
            // 生成时间轴
            createTimeline();
            // 创建照片轮播
            createPhotoCarousel();

            // 按钮事件
            const startBtn = document.getElementById('startBalloonsBtn');
            if (startBtn) {
                startBtn.addEventListener('click', function() {
                    createBalloons();
                    this.textContent = "已点燃气球 · 收集祝福";
                    this.style.backgroundColor = "#e55a8a";
                    this.style.boxShadow = "0 10px 0 #8a2d4d, 0 12px 28px #b13e64";
                    setTimeout(showLovePopup, 1000);   // 1秒后显示爱心弹窗
                });
            }

            // 蛋糕触发按钮事件 - 改为调用新的div弹窗函数
            const cakeTriggerBtn = document.getElementById('cakeTriggerBtn');
            if (cakeTriggerBtn) {
                cakeTriggerBtn.addEventListener('click', function() {
                    createHeartDivs(100); // 生成100个心形祝福框
                });
            }

            // 轮播控制按钮
            const prevBtn = document.getElementById('prevPhotoBtn');
            const nextBtn = document.getElementById('nextPhotoBtn');
            
            if (prevBtn) {
                prevBtn.addEventListener('click', function() {
                    changePhoto(currentPhotoIndex - 1);
                });
            }
            
            if (nextBtn) {
                nextBtn.addEventListener('click', function() {
                    changePhoto(currentPhotoIndex + 1);
                });
            }

            // 关闭弹窗
            const closeBlessing = document.getElementById('closeMessage');
            if (closeBlessing) {
                closeBlessing.addEventListener('click', () => {
                    document.getElementById('blessingMessage').style.display = 'none';
                });
            }

            const closeLove = document.getElementById('closeLove');
            if (closeLove) {
                closeLove.addEventListener('click', () => {
                    document.getElementById('lovePopup').style.display = 'none';
                });
            }

            // BGM 控制
            const audio = document.getElementById('bgmAudio');
            const toggleBtn = document.getElementById('musicToggleBtn');
            const tooltip = document.getElementById('musicTooltip');
            let isPlaying = false;

            if (audio && toggleBtn && tooltip) {
                audio.addEventListener('error', () => {
                    tooltip.innerText = '⚠️ 未找到 birthday.mp3';
                });

                toggleBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (isPlaying) {
                        audio.pause();
                        toggleBtn.innerText = '🔇';
                        toggleBtn.classList.remove('playing');
                        tooltip.innerText = '🎵 点击播放BGM';
                    } else {
                        audio.play().then(() => {
                            isPlaying = true;
                            toggleBtn.innerText = '🎵';
                            toggleBtn.classList.add('playing');
                            tooltip.innerText = '🎶 正在播放';
                        }).catch(() => {
                            tooltip.innerText = '⚠️ 无法播放';
                        });
                    }
                });

                audio.addEventListener('pause', () => {
                    isPlaying = false;
                    toggleBtn.innerText = '🔇';
                    toggleBtn.classList.remove('playing');
                    tooltip.innerText = '🎵 点击播放BGM';
                });

                audio.addEventListener('play', () => {
                    isPlaying = true;
                    toggleBtn.innerText = '🎵';
                    toggleBtn.classList.add('playing');
                    tooltip.innerText = '🎶 正在播放';
                });
            }

            // 彩纸屑
            const confettiContainer = document.getElementById('confettiContainer');
            if (confettiContainer) {
                const colors = ['#ffb3ba', '#ffdfba', '#ffffba', '#baffc9', '#bae1ff', '#f9c7e8', '#e0b3ff', '#ff9f9f', '#feca57', '#ff6b6b'];
                for (let i = 0; i < 150; i++) { // 增加数量到150，因为下落更快
                    const piece = document.createElement('div');
                    piece.classList.add('confetti-piece');
                    const size = Math.floor(Math.random() * 20 + 20); // 20-40px
                    piece.style.width = size + 'px';
                    piece.style.height = size * (Math.random() * 0.8 + 0.7) + 'px';
                    piece.style.left = Math.random() * 100 + '%';
                    piece.style.animationDelay = Math.random() * 5 + 's'; // 0-5秒延迟
                    piece.style.animationDuration = (Math.random() * 4 + 6) + 's'; // 6-10秒完成下落
                    piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    piece.style.opacity = Math.random() * 0.4 + 0.6; // 0.6-1.0
                    piece.style.borderRadius = Math.random() * 60 + 30 + '%';
                    piece.style.transform = `rotate(${Math.random() * 360}deg)`;
                    confettiContainer.appendChild(piece);
                }
            }

            // 窗口大小改变时重新计算照片轮播？不需要，但保持响应式
            window.addEventListener('resize', function() {
                // 可以在这里添加重新计算逻辑，但照片轮播不需要
            });
        });
    </script>
</body>
</html>
