<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎂 生日快乐 🎂</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* ===== 重置 & 基础 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(145deg, #fde9f0 0%, #ffe6f0 40%, #fff9e6 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
            transition: background-color 0.5s ease, background-image 0.5s ease;
            cursor: auto; /* 恢复默认光标 */
        }

        /* 暗夜/烟花模式 (昼夜切换) */
        body.night-mode {
            background: linear-gradient(145deg, #0a0a1a 0%, #0f0f2a 40%, #1a1a3a 100%);
            color: #f0e6d0;
        }
        body.night-mode .birthday-card {
            background: rgba(30, 30, 50, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid #ffd700;
            box-shadow: 0 30px 50px rgba(255, 215, 0, 0.2);
        }
        body.night-mode h1,
        body.night-mode .sub-greeting,
        body.night-mode .balloon-header,
        body.night-mode .timeline-header,
        body.night-mode .carousel-header,
        body.night-mode .heart-popup-header,
        body.night-mode .advice-content {
            color: #ffd700;
            text-shadow: 0 0 15px #ffaa00, 0 0 30px #ff5500;
        }
        body.night-mode .btn-birthday-link {
            background: #5e3a8a;
            box-shadow: 0 10px 0 #2e1b4a, 0 12px 28px #aa6faa;
            border-color: #ffd700;
        }
        body.night-mode .balloon-container,
        body.night-mode .timeline-container,
        body.night-mode .photo-carousel-container,
        body.night-mode .heart-popup-container {
            background: rgba(40, 40, 70, 0.7);
            border-color: #ffd700;
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.2);
        }
        body.night-mode .bottom-advice-bar {
            background: rgba(40, 20, 60, 0.9);
            color: #ffd700;
            border-top-color: #ffd700;
        }
        
        /* 增强版烟花容器 */
        .fireworks-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            overflow: hidden;
            display: none;
        }
        
        /* 烟花粒子 - 增强版 */
        .firework-particle {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            animation: burst 3s ease-out forwards;
            will-change: transform, opacity;
        }
        
        /* 烟花爆炸效果 - 不同类型 */
        .firework-particle.type1 { background: radial-gradient(circle, #ffdd44, #ffaa00); box-shadow: 0 0 20px #ffaa00; }
        .firework-particle.type2 { background: radial-gradient(circle, #ff6b6b, #ff0000); box-shadow: 0 0 20px #ff4444; }
        .firework-particle.type3 { background: radial-gradient(circle, #6bff6b, #00aa00); box-shadow: 0 0 20px #44ff44; }
        .firework-particle.type4 { background: radial-gradient(circle, #6b6bff, #0000ff); box-shadow: 0 0 20px #4444ff; }
        .firework-particle.type5 { background: radial-gradient(circle, #ff6bff, #ff00ff); box-shadow: 0 0 20px #ff44ff; }
        .firework-particle.type6 { background: radial-gradient(circle, #ffff6b, #aaaa00); box-shadow: 0 0 20px #ffff44; }
        
        /* 大烟花粒子（中心亮核） */
        .firework-particle.core {
            width: 12px;
            height: 12px;
            filter: blur(1px);
            z-index: 6;
        }
        
        /* 小烟花粒子（散开） */
        .firework-particle.spark {
            width: 4px;
            height: 4px;
            filter: blur(0.5px);
        }
        
        /* 拖尾效果 */
        .firework-particle.tail {
            width: 3px;
            height: 12px;
            border-radius: 2px;
            background: linear-gradient(to bottom, rgba(255,255,255,0.8), transparent);
        }
        
        @keyframes burst {
            0% { 
                transform: scale(1) translate(0, 0); 
                opacity: 1; 
            }
            70% { 
                opacity: 0.8; 
            }
            100% { 
                transform: scale(0) translate(var(--dx), var(--dy)); 
                opacity: 0; 
            }
        }
        
        /* 烟花升空轨迹 */
        .firework-trail {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            filter: blur(1px);
            animation: trail 1.5s linear forwards;
        }
        
        @keyframes trail {
            0% { transform: translateY(0) scale(1); opacity: 0.8; }
            100% { transform: translateY(-200px) scale(0.2); opacity: 0; }
        }

        /* 彩纸容器 (日间) */
        .floating-confetti {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
            transition: opacity 0.3s;
        }
        .confetti-piece {
            position: absolute;
            width: 24px;
            height: 24px;
            background-color: #ffb3c6;
            opacity: 0.7;
            border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
            animation: fallDown 8s infinite linear;
            box-shadow: 0 0 10px rgba(255, 180, 200, 0.5);
        }
        @keyframes fallDown {
            0% { transform: translateY(-20vh) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(120vh) rotate(720deg); opacity: 0; }
        }
        body.night-mode .floating-confetti {
            opacity: 0;
            pointer-events: none;
        }

        /* ----- 顶部提示条 ----- */
        .top-notice-bar {
            background: rgba(255, 220, 240, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 2px solid #ffffff;
            padding: 12px 24px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 20px 40px;
            font-weight: 600;
            color: #a53860;
            box-shadow: 0 4px 20px #ffb8cf;
            z-index: 20;
            position: relative;
        }
        .notice-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.1rem;
            background: rgba(255,255,255,0.4);
            padding: 6px 18px;
            border-radius: 60px;
            backdrop-filter: blur(2px);
        }
        .notice-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #f76b9c;
            border-radius: 4px;
        }
        .notice-item label {
            cursor: pointer;
        }

        /* ===== 章节导航 ===== */
        .section-nav {
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            padding: 15px 10px;
            border-radius: 50px;
            border: 2px solid rgba(255,255,240,0.8);
            box-shadow: 0 8px 20px rgba(247,120,160,0.3);
        }
        .nav-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #f76b9c;
            border: 3px solid white;
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
        }
        .nav-dot.active {
            background: #ff2e5b;
            transform: scale(1.4);
            box-shadow: 0 0 15px #ff69b4;
        }
        .nav-dot:hover::after {
            content: attr(data-title);
            position: absolute;
            right: 30px;
            top: -5px;
            background: #fec9de;
            color: #a53860;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            white-space: nowrap;
            font-size: 0.9rem;
            border: 2px solid white;
            box-shadow: 0 4px 8px #f598b4;
        }
        body.night-mode .nav-dot {
            background: #ffd700;
            border-color: #fff0c0;
        }
        body.night-mode .nav-dot.active {
            background: #ffaa00;
            box-shadow: 0 0 20px #ffaa00;
        }

        /* ----- 主容器----- */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px 50px;
            position: relative;
            z-index: 10;
        }

        /* 生日主卡片 */
        .birthday-card {
            max-width: 1200px;
            width: 100%;
            background: rgba(255, 255, 255, 0.58);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 48px;
            box-shadow: 
                0 30px 50px rgba(247, 120, 160, 0.2),
                0 0 0 2px rgba(255, 255, 255, 0.7) inset;
            padding: 44px 40px;
            border: 1px solid rgba(255, 220, 235, 0.6);
            margin-bottom: 40px;
            transition: background 0.3s;
        }

        /* 标题区 */
        .title-section {
            text-align: center;
            margin-bottom: 32px;
        }
        .birthday-emoji-big {
            font-size: 4.2rem;
            line-height: 1;
            filter: drop-shadow(0 8px 6px #ffb6c190);
            animation: wobble 2.8s infinite ease-in-out;
        }
        @keyframes wobble {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(6deg) scale(1.1); }
            50% { transform: rotate(-6deg) scale(1.08); }
            75% { transform: rotate(3deg) scale(1.02); }
        }
        h1 {
            font-size: 3.4rem;
            font-weight: 700;
            color: #b34b6b;
            letter-spacing: 2px;
            text-shadow: 0 4px 12px #ffb8d2, 2px 2px 0 #ffffff;
            margin: 8px 0 4px;
        }
        .sub-greeting {
            font-size: 1.4rem;
            font-weight: 600;
            color: #9e5d6f;
            background: rgba(255,255,240,0.5);
            display: inline-block;
            padding: 6px 28px;
            border-radius: 60px;
            backdrop-filter: blur(2px);
            margin-top: 4px;
        }

        /* 蛋糕展示区 */
        .cake-area {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 30px;
            margin: 40px 0 20px;
        }
        .cake-illustration {
            background: #fff2f5e0;
            border-radius: 140px 140px 48px 48px;
            padding: 22px 22px 16px 22px;
            box-shadow: 0 16px 30px #fcaac0;
            transform: rotate(-1deg);
            border: 4px solid white;
        }
        .cake-emoji-big {
            font-size: 8rem;
            line-height: 1;
            display: block;
            filter: drop-shadow(2px 10px 8px #d97093);
        }
        .candle-flame {
            font-size: 2.8rem;
            margin-top: -30px;
            margin-bottom: 8px;
            animation: flicker 0.5s infinite alternate;
        }
        @keyframes flicker {
            0% { 
                text-shadow: 0 0 2px gold, 0 0 8px orange; 
                opacity: 1; 
                transform: scale(1); 
            }
            100% { 
                text-shadow: 0 0 8px yellow, 0 0 16px #ff9f00; 
                opacity: 0.95; 
                transform: scale(1.1); 
            }
        }

        /* ===== 祝福气球专用容器 ===== */
        .balloon-container {
            background: rgba(255, 245, 250, 0.7);
            border-radius: 30px;
            padding: 30px;
            margin: 30px 0;
            box-shadow: 0 10px 25px rgba(247, 120, 160, 0.2);
            border: 2px dashed #f76b9c;
            position: relative;
            overflow: hidden;
        }
        .balloon-header {
            text-align: center;
            margin-bottom: 15px;
            font-size: 1.8rem;
            color: #b34b6b;
            font-weight: 700;
        }
        
        .blessing-balloons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
            position: relative;
            z-index: 1;
            min-height: 120px;
        }
        .balloon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            position: relative;
            cursor: pointer;
            animation: float 4s infinite ease-in-out;
            z-index: 1;
            background: radial-gradient(circle at 30% 30%, #ff9eb5, #ff6b9d);
        }
        .balloon::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff9eb5, #ffb6c1);
            opacity: 0.8;
            z-index: -1;
        }
        .balloon::after {
            content: "";
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 15px;
            height: 30px;
            background: #ff9eb5;
            border-radius: 50%;
            z-index: -1;
        }
        .balloon:hover {
            transform: scale(1.1);
        }
        .balloon.pop {
            animation: pop 0.5s ease-out forwards;
        }
        @keyframes pop {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        /* ===== 祝福弹窗样式 ===== */
        .blessing-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 30px 40px;
            text-align: center;
            max-width: 80%;
            z-index: 1000;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            border: 2px solid #f76b9c;
            display: none;
        }
        .blessing-message h2 {
            font-size: 2.2rem;
            color: #b34b6b;
            margin-bottom: 15px;
        }
        .blessing-message p {
            font-size: 1.6rem;
            color: #9e5d6f;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .close-message {
            background: #f76b9c;
            color: white;
            border: none;
            padding: 10px 30px;
            border-radius: 30px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .close-message:hover {
            background: #e55a8a;
            transform: scale(1.05);
        }

        /* ===== 爱心弹窗样式 ===== */
        .love-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: linear-gradient(145deg, #ff9eb5, #ffb6c1);
            border-radius: 30px;
            padding: 30px;
            text-align: center;
            z-index: 1000;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
            display: none;
            animation: popup 0.5s forwards;
        }
        @keyframes popup {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        .love-popup h2 {
            font-size: 2.2rem;
            color: white;
            margin-bottom: 15px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        .love-popup p {
            font-size: 1.6rem;
            color: white;
            line-height: 1.6;
            margin-bottom: 20px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }
        .close-love {
            background: white;
            color: #b34b6b;
            border: none;
            padding: 10px 30px;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        .close-love:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        /* 时间轴容器样式 */
        .timeline-container {
            background: rgba(255, 245, 250, 0.7);
            border-radius: 30px;
            padding: 30px;
            margin: 30px 0;
            box-shadow: 0 10px 25px rgba(247, 120, 160, 0.2);
            border: 2px dashed #f76b9c;
            position: relative;
            overflow: hidden;
        }
        .timeline-header {
            text-align: center;
            margin-bottom: 25px;
            font-size: 1.8rem;
            color: #b34b6b;
            font-weight: 700;
        }
        .timeline {
            position: relative;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px 0;
        }
        .timeline::before {
            content: '';
            position: absolute;
            top: 1; bottom: 0;
            width: 4px;
            background: #f76b9c;
            left: 50%;
            margin-left: -2px;
            z-index: 1;
        }
        .timeline-item {
            position: relative;
            width: calc(50% - 40px);
            padding: 20px;
            margin-bottom: 50px;
            margin-left: -45px;
            margin-right: 10px;
        }
        .timeline-item:nth-child(odd) {
            float: left;
            clear: both;
            text-align: left;
        }
        .timeline-item:nth-child(even) {
            float: right;
            clear: both;
            text-align: left; 
        }
        .timeline-content {
            background: rgba(255, 255, 255, 0.7);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.5);
            position: relative;
        }
        .timeline-content h3 {
            font-size: 1.8rem;
            color: #b34b6b;
            margin-bottom: 15px;
        }
        .timeline-content p {
            font-size: 1.2rem;
            color: #666;
            line-height: 1.6;
        }
        .timeline-date {
            position: absolute;
            top: -30px;
            width: 100px;
            text-align: center;
            font-weight: 700;
            color: #f76b9c;
            font-size: 1.3rem;
            background: white;
            border-radius: 50%;
            height: 60px;
            line-height: 60px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            z-index: 2;
        }
        .timeline-item:nth-child(odd) .timeline-date {
            right: -50px;
        }
        .timeline-item:nth-child(even) .timeline-date {
            left: -50px;
        }
        .timeline-image {
            width: 125%;
            height: 510px;
            background-size: cover;
            background-position: center;
            border-radius: 15px;
            margin-top: 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }

        /* ===== 轮播照片容器整体样式 ===== */
        .photo-carousel-container {
            background: rgba(255, 245, 250, 0.7);
            border-radius: 30px;
            padding: 30px;
            margin: 30px 0;
            box-shadow: 0 10px 25px rgba(247, 120, 160, 0.2);
            border: 2px dashed #f76b9c;
            position: relative;
            overflow: hidden;
            text-align: center;
        }
        .carousel-header {
            font-size: 1.8rem;
            color: #b34b6b;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .photo-carousel {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 500px;
            margin: 0 auto;
            overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }
        .photo-item {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            pointer-events: none;
        }
        .photo-item.active {
            opacity: 1;
            pointer-events: auto;
        }
        .photo-carousel img {
            width: 100%;
            height: calc(100% - 30px);
            object-fit: cover;
            display: block;
        }
        .photo-title {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #ff9eb5, #ff6b9d);
            color: white;
            font-size: 24px;
            font-weight: 700;
            font-family: 'Quicksand', '微软雅黑', sans-serif;
            padding: 12px 30px;
            border-radius: 50px;
            letter-spacing: 1px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            box-shadow: 0 4px 15px rgba(247, 120, 160, 0.4);
            border: 2px solid white;
            z-index: 10;
            white-space: nowrap;
        }
        .carousel-controls {
            text-align: center;
            margin-top: 20px;
        }
        .prev-btn, .next-btn {
            background: rgba(255, 245, 250, 0.7);
            color: #b34b6b;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
            margin: 0 10px;
        }
        .prev-btn:hover, .next-btn:hover {
            background: #f76b9c;
            color: white;
        }

        /* ===== 祝福心形弹窗容器 ===== */
        .heart-popup-container {
            background: rgba(255, 245, 250, 0.7);
            border-radius: 30px;
            padding: 30px;
            margin: 30px 0;
            box-shadow: 0 10px 25px rgba(247, 120, 160, 0.2);
            border: 2px dashed #f76b9c;
            position: relative;
            overflow: hidden;
            text-align: center;
        }
        .heart-popup-header {
            font-size: 1.8rem;
            color: #b34b6b;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .cake-trigger-btn {
            background: transparent;
            border: none;
            font-size: 4rem;
            cursor: pointer;
            transition: transform 0.3s;
            animation: pulse 2s infinite;
        }
        .cake-trigger-btn:hover {
            transform: scale(1.1);
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* 底部操作区 */

        let autoPlayInterval = null;
        let typingInterval = null; // 用于控制祝福文字的逐字输出

        // === 轮播照片功能 ===
        function createPhotoCarousel() {
            const container = document.getElementById('photoCarousel');
            if (!container) return;
            container.innerHTML = '';
            PHOTO_IMAGES.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'photo-item';
                if (index === 0) div.classList.add('active');
                const img = document.createElement('img');
                img.src = item.src;
                img.alt = item.title;
                div.appendChild(img);
                const titleDiv = document.createElement('div');
                titleDiv.className = 'photo-title';
                titleDiv.innerText = item.title;
                div.appendChild(titleDiv);
                container.appendChild(div);
            });
            if (autoPlayInterval) {
                clearInterval(autoPlayInterval);
            }
        }

        function changePhoto(index) {
            const items = document.querySelectorAll('.photo-item');
            if (items.length === 0) return;
            index = (index + items.length) % items.length;
            items[currentPhotoIndex].classList.remove('active');
            currentPhotoIndex = index;
            items[currentPhotoIndex].classList.add('active');
        }

        // === 气球功能 ===
        function createBalloons() {
            const container = document.getElementById('blessingBalloons');
            if (!container) return;
            container.innerHTML = '';
            for (let i = 0; i < 8; i++) {
                const balloon = document.createElement('div');
                balloon.className = 'balloon';
                balloon.addEventListener('click', function() {
                    showNextBlessing();
                    this.classList.add('pop');
                    setTimeout(() => {
                        this.remove();
                    }, 500);
                });
                container.appendChild(balloon);
            }
        }

        function showNextBlessing() {
            if (BLESSINGS.length === 0) return;
            if (shuffledBlessings.length === 0 || currentIndex >= shuffledBlessings.length) {
                shuffledBlessings = shuffleArray(BLESSINGS);
                currentIndex = 0;
            }
            const fullText = shuffledBlessings[currentIndex];
            const blessingEl = document.getElementById('blessingText');
            const popup = document.getElementById('blessingMessage');
            
            // 清除之前正在进行的打字效果
            if (typingInterval) {
                clearInterval(typingInterval);
                typingInterval = null;
            }
            
            // 清空文本并显示弹窗
            blessingEl.textContent = '';
            popup.style.display = 'block';
            
            let i = 0;
            typingInterval = setInterval(() => {
                if (i < fullText.length) {
                    blessingEl.textContent += fullText.charAt(i);
                    i++;
                } else {
                    clearInterval(typingInterval);
                    typingInterval = null;
                }
            }, 150); // 每50毫秒输出一个字，可自行调整速度（数值越小越快）
            
            currentIndex++;
        }

        function showLovePopup() {
            document.getElementById('loveMessage').textContent = "今天是您的生辰之际，盼往后岁月，喜乐安宁，福寿绵长，万事如意。——三宝";
            const popup = document.getElementById('lovePopup');
            popup.style.display = 'block';
            popup.style.animation = 'none';
            setTimeout(() => {
                popup.style.animation = 'popup 0.5s forwards';
            }, 10);
        }

        function createTimeline() {
            const container = document.getElementById('timeline');
            if (!container) return;
            container.innerHTML = '';
            TIME_LINE_ITEMS.forEach((item, index) => {
                const timelineItem = document.createElement('div');
                timelineItem.className = 'timeline-item';
                // 生成日期显示
                const dateText = index === 0 ? '1966' : 
                                index === 1 ? '70年代' :
                                index === 2 ? '80年代' :
                                index === 3 ? '1982' :
                                index === 4 ? '90年代' :
                                index === 5 ? '2020' :
                                index === 6 ? '2023' : '2025';
                timelineItem.innerHTML = `
                    <div class="timeline-content">
                        <h3>${item.title}</h3>
                        <p>${item.description}</p>
                        <div class="timeline-image" style="background-image: url('${item.image}');"></div>
                    </div>
                    <div class="timeline-date">${dateText}</div>
                `;
                container.appendChild(timelineItem);
            });
        }

        // === 心形div弹窗功能 ===
        function createHeartDivs(count) {
            const heartContainer = document.getElementById('heartContainer');
            if (!heartContainer) return;
            if (isHeartAnimationRunning) return;
            isHeartAnimationRunning = true;
            heartContainer.innerHTML = '';

            const screenWidth = window.innerWidth;
            const screenHeight = window.innerHeight;
            const boxWidth = 180;
            const boxHeight = 80;
            const heartScale = 0.35;

            const boxes = [];
            for (let i = 0; i < count; i++) {
                const t = 2 * Math.PI * i / count;
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                const scaleFactor = Math.min(screenWidth, screenHeight) * heartScale / 16;
                const centerX = screenWidth / 2 - boxWidth / 2;
                const centerY = screenHeight / 2 - boxHeight / 2;
                let left = centerX + x * scaleFactor;
                let top = centerY - y * scaleFactor;
                left += (Math.random() - 0.5) * 15;
                top += (Math.random() - 0.5) * 15;
                left = Math.max(0, Math.min(left, screenWidth - boxWidth));
                top = Math.max(0, Math.min(top, screenHeight - boxHeight));
                let tip;
                if (i === count - 1) {
                    tip = "老爸，生日快乐";
                } else {
                    tip = HEART_TIPS[Math.floor(Math.random() * HEART_TIPS.length)];
                }
                const bgColor = HEART_BG_COLORS[Math.floor(Math.random() * HEART_BG_COLORS.length)];
                boxes.push({ left, top, tip, bgColor });
            }

            let currentBoxIndex = 0;
            function showNextBox() {
                if (currentBoxIndex >= boxes.length) {
                    setTimeout(() => { isHeartAnimationRunning = false; }, 1000);
                    return;
                }
                const box = boxes[currentBoxIndex];
                const div = document.createElement('div');
                div.className = 'heart-blessing-box';
                div.textContent = box.tip;
                div.style.left = box.left + 'px';
                div.style.top = box.top + 'px';
                div.style.width = boxWidth + 'px';
                div.style.height = boxHeight + 'px';
                div.style.backgroundColor = box.bgColor;
                div.style.opacity = '0';
                div.style.transform = 'scale(0.5)';
                heartContainer.appendChild(div);
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        div.style.opacity = '1';
                        div.style.transform = 'scale(1)';
                    });
                });
                setTimeout(() => {
                    if (div.parentNode) {
                        div.style.opacity = '0';
                        div.style.transform = 'scale(0.5)';
                        setTimeout(() => div.remove(), 300);
                    }
                }, 25000);
                currentBoxIndex++;
                setTimeout(showNextBox, 200);
            }
            showNextBox();
        }
        // === 增强版烟花效果 ===
        let nightMode = false;
        const modeBtn = document.getElementById('modeToggleBtn');
        const confetti = document.getElementById('confettiContainer');
        const fireworks = document.getElementById('fireworksContainer');
        const body = document.body;
        
        // 烟花颜色类型
        const fireworkTypes = ['type1', 'type2', 'type3', 'type4', 'type5', 'type6'];
        
        // 创建单次烟花爆炸（多个粒子）
        function createFireworkBurst(centerX, centerY) {
            if (!nightMode || !fireworks) return;
            
            const particleCount = 30 + Math.floor(Math.random() * 40); // 30-70个粒子
            
            // 创建中心亮点（核心）
            const core = document.createElement('div');
            core.className = `firework-particle core ${fireworkTypes[Math.floor(Math.random() * fireworkTypes.length)]}`;
            core.style.left = centerX + 'px';
            core.style.top = centerY + 'px';
            core.style.setProperty('--dx', '0px');
            core.style.setProperty('--dy', '0px');
            fireworks.appendChild(core);
            setTimeout(() => core.remove(), 3000);
            
            // 创建爆炸粒子
            for (let i = 0; i < particleCount; i++) {
                const angle = (Math.PI * 2 * i) / particleCount + Math.random() * 0.5;
                const distance = 80 + Math.random() * 300; // 爆炸半径
                const dx = Math.cos(angle) * distance * (0.8 + Math.random() * 0.4);
                const dy = Math.sin(angle) * distance * (0.8 + Math.random() * 0.4) - 20; // 稍微向上飘
                
                const particle = document.createElement('div');
                const type = fireworkTypes[Math.floor(Math.random() * fireworkTypes.length)];
                const isSpark = Math.random() > 0.7; // 30%概率是小火花
                
                particle.className = `firework-particle ${isSpark ? 'spark' : ''} ${type}`;
                particle.style.left = centerX + 'px';
                particle.style.top = centerY + 'px';
                particle.style.setProperty('--dx', dx + 'px');
                particle.style.setProperty('--dy', dy + 'px');
                particle.style.animationDuration = (2 + Math.random() * 6) + 's'; // 2-4秒
                
                fireworks.appendChild(particle);
                setTimeout(() => particle.remove(), 3000);
            }
            
            // 随机添加一些拖尾粒子
            for (let i = 0; i < 5; i++) {
                const tail = document.createElement('div');
                tail.className = 'firework-particle tail';
                tail.style.left = centerX + 'px';
                tail.style.top = centerY + 'px';
                tail.style.background = `linear-gradient(to bottom, ${Math.random() > 0.5 ? '#ff0' : '#f0f'}, transparent)`;
                tail.style.setProperty('--dx', (Math.random() - 0.5) * 100 + 'px');
                tail.style.setProperty('--dy', -50 - Math.random() * 100 + 'px');
                tail.style.animationDuration = '1.5s';
                fireworks.appendChild(tail);
                setTimeout(() => tail.remove(), 2000);
            }
        }
        
        // 创建升空轨迹
        function createFireworkTrail() {
            if (!nightMode || !fireworks) return;
            
            const startX = Math.random() * window.innerWidth;
            const startY = window.innerHeight + 20; // 从底部开始
            
            for (let i = 0; i < 30; i++) {
                const trail = document.createElement('div');
                trail.className = 'firework-trail';
                trail.style.left = (startX + (Math.random() - 0.5) * 10) + 'px';
                trail.style.top = startY + 'px';
                trail.style.animationDelay = (i * 0.05) + 's';
                fireworks.appendChild(trail);
                setTimeout(() => trail.remove(), 2000);
            }
            
            // 到达顶部后爆炸
            setTimeout(() => {
                if (nightMode) {
                    createFireworkBurst(startX, window.innerHeight * 0.3 + Math.random() * window.innerHeight * 0.4);
                }
            }, 1500);
        }
        
        // 主烟花循环
        function startFireworks() {
            if (!nightMode) return;
            
            // 随机产生烟花
            const interval = setInterval(() => {
                if (!nightMode) {
                    clearInterval(interval);
                    return;
                }
                
                const type = Math.random();
                
                if (type < 0.3) {
                    // 30%概率：升空烟花
                    createFireworkTrail();
                } else {
                    // 70%概率：直接在天空中爆炸
                    const x = Math.random() * window.innerWidth;
                    const y = Math.random() * window.innerHeight * 0.6; // 上半部分天空
                    createFireworkBurst(x, y);
                }
            }, 200); // 每0.2秒产生一个新烟花
            
            window.fireInterval = interval;
        }
        
        if (modeBtn) {
            modeBtn.addEventListener('click', () => {
                nightMode = !nightMode;
                if (nightMode) {
                    body.classList.add('night-mode');
                    if (confetti) confetti.style.display = 'none';
                    if (fireworks) {
                        fireworks.style.display = 'block';
                        fireworks.innerHTML = ''; // 清空已有烟花
                    }
                    modeBtn.innerHTML = '☀️';
                    
                    // 启动烟花效果
                    if (window.fireInterval) clearInterval(window.fireInterval);
                    startFireworks();
                    
                    // 初始时多放几个烟花
                    for (let i = 0; i < 10; i++) {
                        setTimeout(() => {
                            const x = Math.random() * window.innerWidth;
                            const y = Math.random() * window.innerHeight * 0.5;
                            createFireworkBurst(x, y);
                        }, i * 200);
                    }
                } else {
                    body.classList.remove('night-mode');
                    if (confetti) confetti.style.display = 'block';
                    if (fireworks) fireworks.style.display = 'none';
                    modeBtn.innerHTML = '🌙';
                    clearInterval(window.fireInterval);
                }
            });
        }

        // === 初始化 ===
        document.addEventListener('DOMContentLoaded', function() {
            // 生成初始气球
            createBalloons();

            // 创建照片轮播
            createPhotoCarousel();

            // ===== 忆往昔轮播功能 =====
            let currentMemoryIndex = 0; // 添加一个全局变量，可在开头与 currentPhotoIndex 一起定义

            function createMemoryCarousel() {
                const container = document.getElementById('memoryCarousel');
                if (!container) return;
                container.innerHTML = '';
                TIME_LINE_ITEMS.forEach((item, index) => {
                    const div = document.createElement('div');
                    div.className = 'memory-item';
                    if (index === 0) div.classList.add('active');

                    // 图片
                    const img = document.createElement('img');
                    img.src = item.image;
                    img.alt = item.title;
                    img.className = 'memory-image';

                    // 描述区域
                    const descDiv = document.createElement('div');
                    descDiv.className = 'memory-description';

                    const title = document.createElement('h3');
                    title.className = 'fade-up delay-1';
                    title.innerText = item.title;

                    const description = document.createElement('p');
                    description.className = 'fade-up delay-2';
                    description.innerText = item.description;

                    descDiv.appendChild(title);
                    descDiv.appendChild(description);
                    div.appendChild(img);
                    div.appendChild(descDiv);
                    container.appendChild(div);
                });
            }

            function changeMemory(index) {
                const items = document.querySelectorAll('.memory-item');
                if (items.length === 0) return;
                index = (index + items.length) % items.length;
                items[currentMemoryIndex].classList.remove('active');
                currentMemoryIndex = index;
                items[currentMemoryIndex].classList.add('active');
                // 由于描述文字通过 .active 触发渐显，切换后会自动淡入，无需额外操作
            }

            // 在 DOMContentLoaded 内调用 createMemoryCarousel()
            createMemoryCarousel();

            // 绑定按钮事件
            document.getElementById('prevMemoryBtn')?.addEventListener('click', () => changeMemory(currentMemoryIndex - 1));
            document.getElementById('nextMemoryBtn')?.addEventListener('click', () => changeMemory(currentMemoryIndex + 1));

            // 彩纸屑初始化
            const confettiContainer = document.getElementById('confettiContainer');
            if (confettiContainer) {
                const colors = ['#ffb3ba', '#ffdfba', '#ffffba', '#baffc9', '#bae1ff', '#f9c7e8', '#e0b3ff', '#ff9f9f', '#feca57', '#ff6b6b'];
                for (let i = 0; i < 50; i++) {
                    const piece = document.createElement('div');
                    piece.classList.add('confetti-piece');
                    const size = Math.floor(Math.random() * 20 + 20);
                    piece.style.width = size + 'px';
                    piece.style.height = size * (Math.random() * 0.8 + 0.7) + 'px';
                    piece.style.left = Math.random() * 100 + '%';
                    piece.style.animationDelay = Math.random() * 5 + 's';
                    piece.style.animationDuration = (Math.random() * 4 + 6) + 's';
                    piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    piece.style.opacity = Math.random() * 0.4 + 0.6;
                    piece.style.borderRadius = Math.random() * 60 + 30 + '%';
                    piece.style.transform = `rotate(${Math.random() * 360}deg)`;
                    confettiContainer.appendChild(piece);
                }
            }

            // 按钮事件
            const startBtn = document.getElementById('startBalloonsBtn');
            if (startBtn) {
                startBtn.addEventListener('click', function() {
                    createBalloons();
                    this.textContent = "生日快乐";
                    this.style.backgroundColor = "#e55a8a";
                    this.style.boxShadow = "0 10px 0 #8a2d4d, 0 12px 28px #b13e64";
                    setTimeout(showLovePopup, 1000);
                });
            }

            const cakeTriggerBtn = document.getElementById('cakeTriggerBtn');
            if (cakeTriggerBtn) {
                cakeTriggerBtn.addEventListener('click', function() {
                    createHeartDivs(100);
                });
            }

            const prevBtn = document.getElementById('prevPhotoBtn');
            const nextBtn = document.getElementById('nextPhotoBtn');
            if (prevBtn) {
                prevBtn.addEventListener('click', function() {
                    changePhoto(currentPhotoIndex - 1);
                });
            }
            if (nextBtn) {
                nextBtn.addEventListener('click', function() {
                    changePhoto(currentPhotoIndex + 1);
                });
            }

            // 关闭弹窗
            const closeBlessing = document.getElementById('closeMessage');
            if (closeBlessing) {
                closeBlessing.addEventListener('click', () => {
                    if (typingInterval) {
                        clearInterval(typingInterval);
                        typingInterval = null;
                    }
                    document.getElementById('blessingMessage').style.display = 'none';
                });
            }

            const closeLove = document.getElementById('closeLove');
            if (closeLove) {
                closeLove.addEventListener('click', () => {
                    document.getElementById('lovePopup').style.display = 'none';
                });
            }

            // BGM 控制
            const audio = document.getElementById('bgmAudio');
            const toggleBtn = document.getElementById('musicToggleBtn');
            const tooltip = document.getElementById('musicTooltip');
            let isPlaying = false;
            if (audio && toggleBtn && tooltip) {
                audio.addEventListener('error', () => {
                    tooltip.innerText = '⚠️ 未找到 birthday.mp3';
                });
                toggleBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (isPlaying) {
                        audio.pause();
                        toggleBtn.innerText = '🔇';
                        toggleBtn.classList.remove('playing');
                        tooltip.innerText = '🎵 点击播放BGM';
                    } else {
                        audio.play().then(() => {
                            isPlaying = true;
                            toggleBtn.innerText = '🎵';
                            toggleBtn.classList.add('playing');
                            tooltip.innerText = '🎶 正在播放';
                        }).catch(() => {
                            tooltip.innerText = '⚠️ 无法播放';
                        });
                    }
                });
                audio.addEventListener('pause', () => {
                    isPlaying = false;
                    toggleBtn.innerText = '🔇';
                    toggleBtn.classList.remove('playing');
                    tooltip.innerText = '🎵 点击播放BGM';
                });
                audio.addEventListener('play', () => {
                    isPlaying = true;
                    toggleBtn.innerText = '🎵';
                    toggleBtn.classList.add('playing');
                    tooltip.innerText = '🎶 正在播放';
                });
            }
            // ===== 屏幕内文字渐显控制（每个屏幕首次进入时触发一次） =====
            const sections = document.querySelectorAll('.full-page');
            const textObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        // 当屏幕进入视口，添加 active-screen 类（触发内部文字的渐显动画）
                        entry.target.classList.add('active-screen');
                        // 更新右侧导航点激活状态
                        const targetId = entry.target.getAttribute('id');
                        document.querySelectorAll('.nav-dot').forEach(dot => {
                            dot.classList.remove('active');
                            if (dot.dataset.target === targetId) {
                                dot.classList.add('active');
                            }
                        });
                        // 注意：我们不再移除 active-screen，因此每个屏幕的动画只发生一次
                    }
                });
            }, { threshold: 0.5 }); // 当屏幕 50% 可见时触发

            sections.forEach(section => textObserver.observe(section));

            // ===== 滚动透明度控制：让每个屏幕根据在视口中的比例改变透明度 =====
            const pages = document.querySelectorAll('.full-page');
            const viewportHeight = window.innerHeight;

            function updateOpacity() {
                const scrollY = window.scrollY;
                pages.forEach(page => {
                    const rect = page.getBoundingClientRect();
                    const pageTop = rect.top + scrollY;   // 页面顶部相对于文档顶部的距离
                    const pageBottom = pageTop + rect.height;

                    // 计算当前屏幕在视口中的可见高度
                    const visibleTop = Math.max(scrollY, pageTop);
                    const visibleBottom = Math.min(scrollY + viewportHeight, pageBottom);
                    const visibleHeight = Math.max(0, visibleBottom - visibleTop);
                    const visibleRatio = visibleHeight / rect.height; // 0 ~ 1

                    // 透明度直接等于可见比例（线性变化，平滑自然）
                    page.style.opacity = visibleRatio;
                });
            }

            // 使用 requestAnimationFrame 优化滚动性能
            let ticking = false;
            window.addEventListener('scroll', () => {
                if (!ticking) {
                    window.requestAnimationFrame(() => {
                        updateOpacity();
                        ticking = false;
                    });
                    ticking = true;
                }
            });

            // 窗口大小改变时重新计算
            window.addEventListener('resize', updateOpacity);

            // 初始化透明度
            updateOpacity();

            // 为右侧导航点添加点击滚动事件（替代原来的）
            document.querySelectorAll('.nav-dot').forEach(dot => {
                dot.addEventListener('click', () => {
                    const targetId = dot.dataset.target;
                    const targetSection = document.getElementById(targetId);
                    if (targetSection) {
                        targetSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                });
            });
        });
    </script>
</body>
</html>
